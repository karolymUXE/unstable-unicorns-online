name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # ----------------- GAME ENGINE -----------------
      - name: Install dependencies (game-engine)
        working-directory: game-engine
        run: npm install

      - name: Build game-engine
        working-directory: game-engine
        run: npm run build

      - name: Run tests (game-engine) with coverage
        working-directory: game-engine
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: game-engine/coverage/lcov.info
          flags: game-engine
          fail_ci_if_error: true

      - name: Lint game-engine (if available)
        working-directory: game-engine
        run: npm run lint --if-present

      # ----------------- SERVER -----------------
      - name: Install dependencies (server)
        working-directory: server
        run: npm install

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Lint server (if available)
        working-directory: server
        run: npm run lint --if-present

      # ----------------- CLIENT -----------------
      - name: Install dependencies (client)
        working-directory: client
        run: npm install

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Lint client (if available)
        working-directory: client
        run: npm run lint --if-present
